[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Tetris"
version = "1.0.0"
description = "A classic Tetris game"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
    {name = "Onehand-Coding", email = "onehand.coding433@gmail.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment :: Puzzle Games",
]
dependencies = [
    "pygame"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/Onehand-Coding/Tetris"
Repository = "https://github.com/Onehand-Coding/Tetris.git"
Issues = "https://github.com/Onehand-Coding/Tetris/issues"

[project.scripts]
tetris = "tetris.__main__:main"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tetris", "src/kezmenu"]

[tool.hatch.version]
path = "src/tetris/__init__.py"

[tool.hatch.envs.default]
dependencies = [
    "pytest",
    "pytest-cov",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-cov = "pytest --cov=tetris {args:tests}"
cov-report = [
    "- coverage combine",
    "coverage report",
]
cov = [
    "test-cov",
    "cov-report",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.coverage.run]
source_pkgs = ["tetris", "kezmenu"]
branch = true
parallel = true
omit = [
    "src/tetris/__about__.py",
]

[tool.coverage.paths]
tetris = ["src/tetris", "*/tetris/src/tetris"]
kezmenu = ["src/kezmenu", "*/tetris/src/kezmenu"]
tests = ["tests", "*/tetris/tests"]

[tool.coverage.report]
exclude_lines = [
    "no cov",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

